<style>
  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    margin: 0;
    padding: 12px;
  }

  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }

  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
    color: #5f6368;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 13px;
  }

  .buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  button {
    flex: 1;
    padding: 8px 10px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  button.primary {
    background: #1a73e8;
    color: #fff;
  }

  button.primary:disabled {
    background: #a8c7fa;
    cursor: not-allowed;
  }

  button.secondary {
    background: #f1f3f4;
    color: #202124;
  }

  button.secondary:disabled {
    color: #9aa0a6;
    cursor: not-allowed;
  }

  button.apply {
    width: 100%;
    background: #188038;
    color: #fff;
    margin-bottom: 14px;
  }

  button.apply:disabled {
    background: #a8dab5;
    cursor: not-allowed;
  }

  .interim {
    min-height: 20px;
    padding: 6px 8px;
    background: #f8f9fa;
    border-radius: 4px;
    color: #80868b;
    font-style: italic;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 160px;
    padding: 6px 8px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 13px;
    resize: vertical;
    white-space: pre-wrap;
  }

  .status {
    font-size: 12px;
    color: #5f6368;
    margin-bottom: 14px;
  }

  .status.recording::before {
    content: "● ";
    color: #d93025;
  }

  .error {
    min-height: 16px;
    color: #d93025;
    font-size: 12px;
    white-space: pre-wrap;
    margin-top: 4px;
  }

  .note {
    font-size: 11px;
    color: #80868b;
    margin-top: -8px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
</style>
